name: Build STARS HOMES Releases (Windows & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Analyze & Unit Tests
        working-directory: frontend
        run: |
          flutter analyze --no-pub
          flutter test

      - name: Build Windows Application
        working-directory: frontend
        run: flutter build windows --release

      - name: Compile Windows Setup Installer (Inno Setup)
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Compiling Inno Setup installer using: $iscc"
          & $iscc windows_installer\installer_script.iss
          if (-not (Test-Path "windows_installer\STARS_HOMES_ERP_Setup.exe")) {
            throw "Error: STARS_HOMES_ERP_Setup.exe was not created!"
          }

      - name: Compress Portable Windows Zip
        run: |
          Compress-Archive -Path "frontend\build\windows\x64\runner\Release\*" -DestinationPath "windows_installer\STARS_HOMES_ERP_Windows_Portable.zip" -Force

      - name: Upload Windows Installer (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Setup
          path: windows_installer\STARS_HOMES_ERP_Setup.exe
          if-no-files-found: error

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Portable
          path: windows_installer\STARS_HOMES_ERP_Windows_Portable.zip

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Android_APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Setup Artifact
        uses: actions/download-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Setup
          path: release-assets

      - name: Download Windows Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Portable
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: STARS_HOMES_ERP_Android_APK
          path: release-assets

      - name: Rename Android APK for Release
        run: |
          if [ -f release-assets/app-release.apk ]; then
            mv release-assets/app-release.apk release-assets/STARS_HOMES_ERP_Android.apk
          fi

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' frontend/pubspec.yaml | head -n 1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: STARS HOMES ERP ${{ steps.get_version.outputs.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## STARS HOMES ERP Release ${{ steps.get_version.outputs.TAG }}
            
            تحديث رسمي لنظام مصنع ستارز هومز للأثاث والموبيليا.
            
            ### المرفقات المتاحة للتحميل والتحديث:
            - **`STARS_HOMES_ERP_Setup.exe`**: مثبت الويندوز المباشر لأجهزة اللابتوب والكمبيوتر (Windows 11).
            - **`STARS_HOMES_ERP_Windows_Portable.zip`**: حزمة الويندوز المحمولة القابلة للتشغيل المباشر من الفلاشة.
            - **`STARS_HOMES_ERP_Android.apk`**: تطبيق هواتف الأندرويد.
            - **`SHA256SUMS.txt`**: بصمات التحقق الرقمية المشفرة (SHA-256) للتأكد من سلامة وأمان التنزيل.
          files: |
            release-assets/STARS_HOMES_ERP_Setup.exe
            release-assets/STARS_HOMES_ERP_Windows_Portable.zip
            release-assets/STARS_HOMES_ERP_Android.apk
            release-assets/SHA256SUMS.txt
