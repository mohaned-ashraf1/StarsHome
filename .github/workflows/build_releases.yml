name: Build STARS HOMES Releases (Windows & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Analyze & Unit Tests
        working-directory: frontend
        run: |
          flutter analyze --no-pub
          flutter test

      - name: Build Windows Application
        working-directory: frontend
        run: flutter build windows --release

      - name: Compile Windows Setup Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer\installer_script.iss

      - name: Compress Portable Windows Zip
        run: |
          Compress-Archive -Path "frontend\build\windows\x64\runner\Release\*" -DestinationPath "windows_installer\STARS_HOMES_ERP_Windows_Portable.zip" -Force

      - name: Upload Windows Installer (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Setup
          path: windows_installer\STARS_HOMES_ERP_Setup.exe
          if-no-files-found: error

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Windows_Portable
          path: windows_installer\STARS_HOMES_ERP_Windows_Portable.zip

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: STARS_HOMES_ERP_Android_APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
